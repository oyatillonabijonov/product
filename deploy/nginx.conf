# nginx — TLS tugatish, statik fayllar va sahifa keshi.
# /etc/nginx/sites-available/product-store
#
# Sertifikat: sudo certbot --nginx -d example.uz -d www.example.uz

proxy_cache_path /var/cache/nginx/product levels=1:2 keys_zone=product:20m max_size=1g inactive=10m;

server {
    listen 80;
    server_name example.uz www.example.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.uz www.example.uz;

    ssl_certificate     /etc/letsencrypt/live/example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.uz/privkey.pem;

    # Rasm yuklash chegarasi (app 5MB ni tekshiradi, bu esa unga zaxira)
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashlangan build assetlari — o'zgarmaydi
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache product;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ilova `Cache-Control: s-maxage=60, stale-while-revalidate=240` yuboradi —
        # storefront sahifalari shu bo'yicha keshlanadi, /admin va /api keshlanmaydi.
        proxy_cache product;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
