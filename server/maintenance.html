<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:16px;background:#F4F5F7;color:#1D1D1F;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:1040px;background:#fff;border-radius:28px;padding:28px;display:grid;gap:8px}
.logo{height:28px;width:auto}
.body{display:grid;align-items:center;gap:8px}
.art svg{width:100%;height:auto;display:block}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#C66F00}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:#FF9F0A}
h1{font-size:44px;line-height:1.08;letter-spacing:-.003em;font-weight:600;margin:12px 0 16px}
p{font-size:17px;line-height:1.47;letter-spacing:-.022em;color:#6E6E73;margin:0 0 8px;max-width:30em}
p.ru{font-size:15px;color:#86868B;margin-top:16px}
.bar{transform-box:fill-box;transform-origin:left;animation:load 3.2s cubic-bezier(.4,0,.2,1) infinite}
.g1{animation:spin 8s linear infinite}.g2{animation:spin 6s linear infinite reverse}
@keyframes load{0%{transform:scaleX(.08)}70%,100%{transform:scaleX(.92)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bar,.g1,.g2{animation:none}.bar{transform:scaleX(.7)}}
@media (min-width:768px){.card{padding:40px 48px 56px}.body{grid-template-columns:1.1fr 1fr;gap:40px}}
@media (max-width:767px){h1{font-size:32px}}
</style>
